<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ax" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5F6368"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#FFFFFF"/>

  <!-- title -->
  <text x="450" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">LIF 막전위 갱신 (Membrane Potential Update)</text>
  <text x="450" y="76" text-anchor="middle" font-size="16" fill="#5F6368">매 timestep · 각 LIF 뉴런 공통 동작</text>

  <!-- equation box -->
  <rect x="80" y="100" width="740" height="158" rx="14" fill="#F8F2FE" stroke="#8430CE" stroke-width="2.4" stroke-dasharray="7 4"/>
  <text x="450" y="162" text-anchor="middle" font-size="38" font-weight="700" fill="#202124">V[t] = (7/8)·V[t−1] + Σ wᵢ xᵢ</text>
  <text x="300" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#8430CE">leak (decay)</text>
  <text x="585" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#8430CE">integrate</text>
  <text x="450" y="232" text-anchor="middle" font-size="17" fill="#202124">V[t] ≥ θ → spike =1, V ← 0  (fire &amp; reset)   |   else → V 유지   |   leak = (V×7) &gt;&gt; 3</text>

  <!-- waveform panel -->
  <rect x="80" y="278" width="740" height="252" rx="14" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.6"/>
  <text x="100" y="306" font-size="15" font-weight="700" fill="#3C4043">막전위 V(t) 거동 — leaky integrate → fire → reset</text>

  <!-- axes -->
  <line x1="150" y1="492" x2="800" y2="492" stroke="#5F6368" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="150" y1="492" x2="150" y2="324" stroke="#5F6368" stroke-width="2" marker-end="url(#ax)"/>
  <text x="560" y="513" font-size="14" fill="#5F6368">timestep →</text>
  <text x="128" y="336" font-size="16" font-weight="700" fill="#5F6368">V</text>

  <!-- threshold line -->
  <line x1="150" y1="360" x2="800" y2="360" stroke="#C5221F" stroke-width="1.8" stroke-dasharray="8 5"/>
  <text x="806" y="365" font-size="15" font-weight="700" fill="#C5221F">θ</text>
  <text x="158" y="352" font-size="12.5" fill="#C5221F">threshold</text>
  <text x="160" y="513" font-size="12.5" fill="#5F6368">V = 0 (reset level)</text>

  <!-- membrane potential waveform -->
  <polyline fill="none" stroke="#8430CE" stroke-width="3"
    points="150,492 182,468 214,452 246,424 278,398 310,372 340,358
            342,492 374,470 406,448 438,420 470,392 502,366 524,356
            526,492 558,474 590,458 622,450 654,454 686,470 718,482 750,488 782,490"/>

  <!-- spikes at threshold crossings -->
  <g stroke="#C5221F" stroke-width="3">
    <line x1="340" y1="358" x2="340" y2="330"/>
    <line x1="524" y1="356" x2="524" y2="330"/>
  </g>
  <g fill="#C5221F">
    <polygon points="340,326 335,338 345,338"/>
    <polygon points="524,326 519,338 529,338"/>
  </g>
  <text x="340" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#C5221F">spike</text>
  <text x="524" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#C5221F">spike</text>

  <!-- annotations -->
  <text x="186" y="414" font-size="13" fill="#8430CE">integrate ↑</text>
  <text x="352" y="404" font-size="13" fill="#5F6368">reset → 0</text>
  <text x="598" y="426" font-size="13" fill="#5F6368">leak (sub-threshold)</text>
</svg>
