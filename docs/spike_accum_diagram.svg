<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#FFFFFF"/>

  <!-- title -->
  <text x="450" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">Spike Accumulation — Rate Coding</text>
  <text x="450" y="76" text-anchor="middle" font-size="16" fill="#5F6368">20 timestep 동안 FC2 출력 뉴런의 spike 수를 누적 후 비교</text>

  <!-- timeline label -->
  <text x="60" y="128" font-size="13" fill="#5F6368">timestep</text>
  <text x="200" y="128" font-size="13" fill="#5F6368">1</text>
  <text x="770" y="128" font-size="13" fill="#5F6368">20</text>
  <line x1="200" y1="134" x2="770" y2="134" stroke="#DADCE0" stroke-width="1.4"/>

  <!-- Row A : neuron 0 (Flying) -->
  <text x="60" y="178" font-size="16" font-weight="700" fill="#188038">FC2 #0</text>
  <text x="60" y="198" font-size="13" fill="#188038">(Flying)</text>
  <line x1="200" y1="210" x2="780" y2="210" stroke="#BDBDBD" stroke-width="1.4"/>
  <g stroke="#188038" stroke-width="4">
    <line x1="230" y1="210" x2="230" y2="162"/><line x1="260" y1="210" x2="260" y2="162"/>
    <line x1="320" y1="210" x2="320" y2="162"/><line x1="350" y1="210" x2="350" y2="162"/>
    <line x1="410" y1="210" x2="410" y2="162"/><line x1="440" y1="210" x2="440" y2="162"/><line x1="470" y1="210" x2="470" y2="162"/>
    <line x1="530" y1="210" x2="530" y2="162"/><line x1="560" y1="210" x2="560" y2="162"/>
    <line x1="620" y1="210" x2="620" y2="162"/><line x1="650" y1="210" x2="650" y2="162"/>
    <line x1="710" y1="210" x2="710" y2="162"/><line x1="740" y1="210" x2="740" y2="162"/><line x1="770" y1="210" x2="770" y2="162"/>
  </g>
  <text x="810" y="195" font-size="22" font-weight="700" fill="#188038">= 14</text>

  <!-- Row B : neuron 1 (Non-flying) -->
  <text x="60" y="288" font-size="16" font-weight="700" fill="#C5221F">FC2 #1</text>
  <text x="60" y="308" font-size="13" fill="#C5221F">(Non-flying)</text>
  <line x1="200" y1="320" x2="780" y2="320" stroke="#BDBDBD" stroke-width="1.4"/>
  <g stroke="#C5221F" stroke-width="4">
    <line x1="290" y1="320" x2="290" y2="272"/><line x1="380" y1="320" x2="380" y2="272"/>
    <line x1="500" y1="320" x2="500" y2="272"/><line x1="590" y1="320" x2="590" y2="272"/>
    <line x1="680" y1="320" x2="680" y2="272"/><line x1="770" y1="320" x2="770" y2="272"/>
  </g>
  <text x="810" y="305" font-size="22" font-weight="700" fill="#C5221F">= 6</text>

  <!-- comparison -->
  <text x="450" y="408" text-anchor="middle" font-size="28" font-weight="700" fill="#202124">spike_count_0 = 14   &gt;   spike_count_1 = 6</text>
  <text x="450" y="438" text-anchor="middle" font-size="15" fill="#5F6368">가장 많이 발화한 출력 뉴런 선택 (argmax)</text>

  <!-- result -->
  <rect x="300" y="462" width="300" height="62" rx="14" fill="#E6F4EA" stroke="#188038" stroke-width="2.6"/>
  <text x="450" y="503" text-anchor="middle" font-size="28" font-weight="700" fill="#0F7B34">result = Flying</text>
</svg>
